# Local dev stack: web :3000, api :4000, mysql :3306, redis :6379
services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00 --innodb-flush-log-at-trx-commit=2 --sync-binlog=0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: damez
      MYSQL_USER: damez
      MYSQL_PASSWORD: damez
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env.example]
    environment:
      DATABASE_URL: mysql://damez:damez@mysql:3306/damez
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "true"
      NODE_ENV: development
    ports: ["4000:4000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: "true"
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mysql_data:
  redis_data:
